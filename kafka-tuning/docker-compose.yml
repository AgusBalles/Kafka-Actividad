services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # --- TUNING DEL BROKER (RETENCIÓN) ---
      # Borrar mensajes después de 5 minutos (default es 7 días)
      KAFKA_LOG_RETENTION_HOURS: 0
      KAFKA_LOG_RETENTION_MINUTES: 5
      # Borrar mensajes si el topic supera 50MB (default es -1 infinito)
      KAFKA_LOG_RETENTION_BYTES: 52428800
      # Verificar logs para borrar cada 1 minuto
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      # Segmentos de 1MB (default 1GB): Kafka solo borra segmentos cerrados.
      # Con snappy + batching, 500.000 mensajes ocupan ~6MB en total, así que con
      # segmentos más grandes ninguno se cierra y la retención no se ve
      KAFKA_LOG_SEGMENT_BYTES: 1048576

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8081:8080"  # 8080 lo usa Oracle XE en esta PC
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
